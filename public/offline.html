<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RankRoom is offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0a0c10;
        color: #e9eff8;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .bars {
        display: flex;
        width: min(420px, 80vw);
        height: 10px;
        margin: 0 auto 2rem;
      }
      .bars i {
        flex: 1;
      }
      h1 {
        font-size: clamp(1.5rem, 6vw, 2.5rem);
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        color: #7e8ca3;
        max-width: 42ch;
        margin: 0 auto;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="bars" aria-hidden="true">
        <i style="background: #d8dee9"></i><i style="background: #e8d24b"></i>
        <i style="background: #4fd3de"></i><i style="background: #4fce7c"></i>
        <i style="background: #c267d6"></i><i style="background: #e25353"></i>
        <i style="background: #5d7ce8"></i>
      </div>
      <h1>No signal</h1>
      <p>
        This page has not been cached yet. Reconnect once and RankRoom will keep working offline
        afterwards.
      </p>
    </main>
  </body>
</html>
