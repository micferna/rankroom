# Optional Postgres, for hosts that do not already run one.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rankroom
      POSTGRES_DB: rankroom
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - rankroom-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rankroom']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    depends_on:
      db:
        condition: service_healthy

volumes:
  rankroom-data:

secrets:
  db_password:
    file: ./db_password.txt
