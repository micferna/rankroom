name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  # Advisories appear without anyone touching the code, so the dependency
  # audit runs on a clock as well as on a push.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  check:
    name: Format, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rankroom
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: rankroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rankroom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The authorisation and pentest suites need a real database; without this
      # they skip, and skipping the tests that matter most would defeat the point.
      TEST_DATABASE_URL: postgres://rankroom:dev@127.0.0.1:5432/rankroom

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Checkout otherwise leaves the job token in .git/config, where
          # anything that archives the workspace carries it out with it.
          # Nothing here pushes, so nothing here needs it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: server

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib

      # Split out and named, so a red run says which guarantee broke rather than
      # just "tests failed".
      - name: Authorisation tests
        run: cargo test --locked --test authorisation

      - name: Attack the server
        run: cargo test --locked --test pentest

      - name: Fuzz the board validator
        env:
          FUZZ_ITERATIONS: 250000
        run: cargo test --release --locked --test fuzz_validation

      - name: Build release
        run: cargo build --release --locked

  supply-chain:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Checkout otherwise leaves the job token in .git/config, where
          # anything that archives the workspace carries it out with it.
          # Nothing here pushes, so nothing here needs it.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: server

      - name: Install cargo-deny
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-deny

      - name: Check advisories, licences and sources
        run: cargo deny check

      # deny.toml ignores RUSTSEC-2023-0071 on the grounds that `rsa` is never
      # compiled in. That premise is checked here, so the ignore cannot quietly
      # go stale: if `rsa` ever becomes a real dependency, this fails.
      - name: Assert rsa is unreachable
        run: |
          if cargo tree -i rsa -e normal 2>/dev/null | grep -q '^rsa v'; then
            echo "::error::rsa is now a real dependency — RUSTSEC-2023-0071 applies. Remove the ignore in deny.toml."
            exit 1
          fi
          echo "rsa is not in the compiled dependency graph, as deny.toml assumes."
