version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint pins `typescript <6.1`, so a major bump breaks linting
      # before the toolchain can use it. Revisit when they widen the range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # One PR per ecosystem keeps the noise down and the review meaningful.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'vitest', '@vitest/*']
      build:
        patterns: ['vite', '@vitejs/*', 'tailwindcss', '@tailwindcss/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
